name: Rappels de révision DUERP

# Déclenche chaque matin l'envoi des rappels de révision annuelle
# (route POST /api/cron/revision-reminders de api/server.ts).
# Secrets à créer dans GitHub > Settings > Secrets and variables > Actions :
#   KAIJOS_API_URL : adresse du serveur, ex. https://kaijos-api.onrender.com
#   CRON_SECRET    : même valeur que la variable CRON_SECRET sur Render
on:
  schedule:
    - cron: "0 6 * * *" # 6 h UTC, soit 7 h ou 8 h à Paris
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Appelle la route des rappels
        env:
          KAIJOS_API_URL: ${{ secrets.KAIJOS_API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$KAIJOS_API_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Secrets KAIJOS_API_URL / CRON_SECRET absents : rappels non configurés, rien à faire."
            exit 0
          fi
          # Le serveur Render gratuit peut mettre jusqu'à une minute à se réveiller.
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 20 --retry-all-errors --max-time 120 \
            -X POST "$KAIJOS_API_URL/api/cron/revision-reminders" \
            -H "Authorization: Bearer $CRON_SECRET"
