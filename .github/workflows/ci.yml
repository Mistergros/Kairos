name: CI

on:
  push:
    branches: [master, staging]
  pull_request:
    branches: [master, staging]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Valide les fichiers de config JSON (config/*)
        run: npm run config:validate

      - name: Quotas d'établissements et de clients sur 12 mois
        run: npm run test:slots

      - name: Marque du cabinet sur les documents
        run: npm run test:branding

      - name: Build de production
        run: npm run build
